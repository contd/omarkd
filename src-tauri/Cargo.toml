[package]
name = "omarkd"
version = "0.1.3"
description = "A fast, native Markdown viewer"
edition = "2021"

[lib]
name = "omarkd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[example]]
name = "render-fixtures"
path = "../e2e/support/render-fixtures.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comrak = { version = "0.56", default-features = false, features = ["shortcodes", "syntect"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
notify = "8"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
