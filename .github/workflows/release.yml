name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Check tag and manifest versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun run release:check "$RELEASE_TAG"

  desktop:
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: bun install --frozen-lockfile
      - run: bun run test:types
      - name: Check native code on this platform
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Build and upload unsigned release bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: "true"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Omarkd ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your platform below.

            These initial macOS and Windows builds are unsigned and are not notarized. Your OS may display trust warnings.

            Documentation: https://${{ github.repository_owner }}.github.io/omarkd/
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: false
          tauriScript: bun run tauri
          args: --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked

  docs:
    needs: desktop
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  publish:
    needs: [desktop, docs]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish only after every bundle and the Pages deployment succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
